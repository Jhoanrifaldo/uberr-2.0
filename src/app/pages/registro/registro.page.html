<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="" color="dark"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form class="form u-centro-pagina" (ngSubmit)="crear()">
    <h1 class="u-h1">Crea tu cuenta</h1>
    <p class="u-muted">¿Cómo vas a usar la app?</p>

    <div class="roles">
      <button type="button" [class.on]="rol() === 'pasajero'" (click)="rol.set('pasajero')">
        <ion-icon name="person-outline"></ion-icon>
        <strong>Pasajero</strong>
        <span>Pide viajes</span>
      </button>
      <button type="button" [class.on]="rol() === 'conductor'" (click)="rol.set('conductor')">
        <ion-icon name="car-sport-outline"></ion-icon>
        <strong>Conductor</strong>
        <span>Gana conduciendo</span>
      </button>
    </div>

    <label class="u-label">Nombre completo</label>
    <ion-input class="u-input" fill="solid" name="name" autocomplete="name" placeholder="Tu nombre" [(ngModel)]="name"></ion-input>

    <label class="u-label">Correo electrónico</label>
    <ion-input class="u-input" fill="solid" type="email" name="email" autocomplete="email" placeholder="nombre@correo.com" [(ngModel)]="email"></ion-input>

    <label class="u-label">Celular</label>
    <ion-input class="u-input" fill="solid" type="tel" name="phone" autocomplete="tel" placeholder="300 123 4567" [(ngModel)]="phone"></ion-input>

    <label class="u-label">Contraseña</label>
    <ion-input class="u-input" fill="solid" type="password" name="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" [(ngModel)]="password">
      <ion-input-password-toggle slot="end" color="dark"></ion-input-password-toggle>
    </ion-input>

    <ion-button class="u-btn" expand="block" type="submit" [disabled]="cargando()">
      @if (cargando()) { <ion-spinner name="crescent"></ion-spinner> } @else { Registrarme }
    </ion-button>

    <p class="u-small u-muted legal">Al registrarte aceptas los términos del servicio y la política de privacidad.</p>
  </form>
</ion-content>
